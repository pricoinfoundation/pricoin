# Phase 1 — HTTP-only vhost used to satisfy Let's Encrypt's
# HTTP-01 challenge. Replaced by `nginx-relay.conf` (full TLS
# vhost) by install.sh after `certbot certonly --webroot` issues
# the cert.
server {
    listen 80;
    listen [::]:80;
    server_name RELAY_HOSTNAME_HERE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "pricoin relay: cert provisioning in progress\n";
    }
}
