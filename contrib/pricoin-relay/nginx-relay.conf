# Pricoin relay — nginx vhost. TLS termination via certbot
# Let's Encrypt cert for the per-node relay<N>.pricoin.io. Reverse-
# proxies WebSocket traffic to local strfry on 127.0.0.1:7777.
#
# install.sh substitutes RELAY_HOSTNAME_HERE before dropping this
# file at /etc/nginx/sites-available/pricoin-relay and symlinks
# into sites-enabled/.

# HTTP → HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name RELAY_HOSTNAME_HERE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — strfry reverse proxy + NIP-11 info doc.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name RELAY_HOSTNAME_HERE;

    ssl_certificate     /etc/letsencrypt/live/RELAY_HOSTNAME_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/RELAY_HOSTNAME_HERE/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logs.
    access_log /var/log/nginx/pricoin-relay.access.log;
    error_log  /var/log/nginx/pricoin-relay.error.log;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket upgrade — required for Nostr's wss://.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-lived subscriptions: don't time out idle WS streams.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
