##
## Pricoin strfry relay config — drop-in for the four-node mesh
## (relay1..4.pricoin.io). Each instance keeps its own LMDB and
## cross-streams to the other three via systemd units installed
## alongside this file.
##
## Replace `RELAY_HOSTNAME_HERE` (info.name) and `RELAY_URL_HERE`
## (info.contact) for each box, and set `db = "/var/lib/pricoin-relay/db"`
## to wherever you provisioned LMDB storage. Everything else is
## intended to be the same on all four nodes for predictable mesh
## behavior.
##

# strfry's persistence directory — LMDB files live here. Pre-create
# `mkdir -p /var/lib/pricoin-relay/db && chown -R pricoin-relay: ...`.
db = "/var/lib/pricoin-relay/db"

dbParams {
    maxreaders = 256
    # 64 GiB cap. Pricoin orderbook + DM traffic is tiny in
    # absolute terms; this is plenty of headroom for years.
    mapsize = 68719476736
    noReadAhead = false
}

events {
    # Reject events older than 30 days at ingest. Replaceable
    # offers (kind=30030) get superseded long before that.
    rejectEventsOlderThanSeconds = 2592000
    # Reject events dated more than 5 minutes in the future.
    rejectEventsNewerThanSeconds = 300
    # Cap event size at 256 KiB. NIP-04 DMs and offer URIs are
    # well under this; bigger payloads are almost certainly spam.
    maxEventSize = 262144
    # Limit tags + content depth — defensive against malformed input.
    maxNumTags = 32
    maxTagValSize = 1024
}

relay {
    # strfry binds locally; Caddy front-ends with TLS on :443.
    bind = "127.0.0.1"
    port = 7777
    # Loopback only — TLS is nginx's job. nofiles must not exceed
    # the systemd unit's LimitNOFILE; 65536 is plenty for our scale
    # (a few hundred concurrent client subscriptions + 3 mesh streams).
    nofiles = 65536

    info {
        name = "RELAY_HOSTNAME_HERE"
        description = "Pricoin orderbook + NIP-04 DM relay (kind 4 + 30030)."
        pubkey = ""
        contact = "https://RELAY_URL_HERE/"
        software = "https://github.com/hoytech/strfry"
        version = "0.x"
        # Limit advertised supported NIPs to what we actually use.
        supported_nips = [1, 4, 9, 11, 13, 20, 33, 40]
    }

    # Permissive defaults for the public Pricoin mesh; tighten
    # later if abuse becomes an issue.
    autoCommit = true
    realIpHeader = "X-Forwarded-For"

    writePolicy {
        # Allow only kinds we expect from Pricoin traffic plus
        # NIP-09 deletes (kind=5). Drop everything else at ingest
        # so the relays don't accumulate unrelated Nostr noise.
        plugin = "/usr/local/lib/pricoin-relay/writepolicy.sh"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpOutEvents = false
        dbScanPerf = false
        invalidEvents = false
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        yesstr = 1
    }
}
