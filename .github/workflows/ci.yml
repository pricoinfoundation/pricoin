# Pricoin-flavoured CI. Runs on pull requests only — direct branch pushes
# (and tag pushes) are handled by `.github/workflows/release.yml`, so we
# don't double-trigger when a release tag is pushed alongside a main
# update.
#
# This is deliberately minimal: build the depends-static Linux binaries,
# then run the Pricoin functional smoke test (`feature_pricoin_ct.py`).
# Most of upstream Bitcoin Core's test suite is incompatible with
# Pricoin's privacy-mandatory consensus (see PRICOIN_KNOWN_BROKEN in
# `test/functional/test_runner.py`); we lean on the Pricoin filter.

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Linux x86_64 build + Pricoin smoke test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make pkgconf python3 \
            curl wget bison patch xz-utils ca-certificates \
            autoconf automake libtool gettext

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-pc-linux-gnu
          key: depends-linux-${{ hashFiles('depends/packages/*.mk', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/linux.mk') }}

      - name: Build dependencies
        run: cd depends && make -j "$(nproc)" HOST=x86_64-pc-linux-gnu NO_QR=1

      - name: Configure
        run: |
          cmake -S . -B build \
            --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake \
            -DBUILD_GUI=OFF -DWITH_QRENCODE=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build daemon, CLI, tx, util
        run: cmake --build build --target bitcoind bitcoin-cli bitcoin-tx bitcoin-util -j "$(nproc)"

      - name: Run Pricoin functional smoke test
        run: |
          ln -sf "$PWD/build/test/config.ini" "$PWD/test/config.ini"
          ln -sf "$PWD/test/functional/feature_pricoin_ct.py" \
                "$PWD/build/test/functional/feature_pricoin_ct.py"
          BITCOIND=$PWD/build/bin/pricoind \
          BITCOINCLI=$PWD/build/bin/pricoin-cli \
          python3 test/functional/test_runner.py --pricoin --filter feature_pricoin_ct
