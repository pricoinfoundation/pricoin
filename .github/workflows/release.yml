name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to label the release with (e.g. v0.1.0). Used for filenames; the release itself will be a draft."
        required: true
        default: "v0.1.0-test"

permissions:
  contents: write

jobs:
  resolve-tag:
    name: Resolve tag for filenames
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Linux x86_64 (daemon, cli, qt) — depends static
    needs: resolve-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          # Just the host compiler + things needed to drive the depends build
          # (and a few autotools bits required by some Qt sub-packages). All
          # actual link-time deps (Qt, Boost, libevent, sqlite, zmq, the X/xcb
          # stack) are built static via depends/, not pulled from apt.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make pkgconf python3 \
            curl wget bison patch xz-utils ca-certificates \
            autoconf automake libtool gettext

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-pc-linux-gnu
          key: depends-linux-${{ hashFiles('depends/packages/*.mk', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/linux.mk') }}

      - name: Build dependencies
        run: cd depends && make -j "$(nproc)" HOST=x86_64-pc-linux-gnu NO_QR=1

      - name: Configure
        run: |
          cmake -S . -B build \
            --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake \
            -DBUILD_GUI=ON -DWITH_QRENCODE=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Strip binaries
        run: strip build/bin/pricoind build/bin/pricoin-cli build/bin/pricoin-qt

      - name: Run Pricoin functional tests
        run: |
          ln -sf "$PWD/build/test/config.ini" "$PWD/test/config.ini"
          ln -sf "$PWD/test/functional/feature_pricoin_ct.py" "$PWD/build/test/functional/feature_pricoin_ct.py"
          BITCOIND=$PWD/build/bin/pricoind \
          BITCOINCLI=$PWD/build/bin/pricoin-cli \
          python3 test/functional/test_runner.py --pricoin --filter 'feature_pricoin_ct'

      - name: Show link footprint
        run: |
          echo "== ldd pricoin-qt =="; ldd build/bin/pricoin-qt || true
          echo "== glibc version requirement =="
          objdump -T build/bin/pricoin-qt 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -5

      - name: Package
        run: |
          mkdir -p dist
          STAGE="pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-linux"
          mkdir -p "dist/$STAGE"
          cp build/bin/pricoind        "dist/$STAGE/"
          cp build/bin/pricoin-cli     "dist/$STAGE/"
          cp build/bin/pricoin-qt      "dist/$STAGE/"
          cp COPYING                   "dist/$STAGE/"
          cp README.md                 "dist/$STAGE/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pricoin-linux-x86_64
          path: dist/*.tar.gz

  build-windows:
    name: Windows x86_64 (qt) — cross from Linux
    needs: resolve-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make pkgconf python3 \
            curl wget bison patch xz-utils \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-w64-mingw32
          key: depends-mingw32-${{ hashFiles('depends/packages/*.mk', 'depends/Makefile', 'depends/funcs.mk') }}

      - name: Build dependencies
        run: cd depends && make -j "$(nproc)" HOST=x86_64-w64-mingw32 NO_QT=

      - name: Configure
        run: |
          cmake -S . -B build \
            --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=ON -DWITH_QRENCODE=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Strip
        run: x86_64-w64-mingw32-strip build/bin/pricoin-qt.exe

      - name: Package
        run: |
          mkdir -p dist
          STAGE="pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-windows"
          mkdir -p "dist/$STAGE"
          cp build/bin/pricoin-qt.exe "dist/$STAGE/"
          cp COPYING                  "dist/$STAGE/"
          cp README.md                "dist/$STAGE/"
          (cd dist && zip -r "${STAGE}.zip" "$STAGE")
          rm -rf "dist/$STAGE"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pricoin-windows-x86_64
          path: dist/*.zip

  build-macos:
    name: macOS ${{ matrix.arch }} (qt)
    needs: resolve-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            brew_prefix: /opt/homebrew
          - runner: macos-13
            arch: x86_64
            brew_prefix: /usr/local
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew update
          brew install cmake ninja boost libevent qt@6 sqlite zeromq pkgconf

      - name: Configure
        env:
          # Homebrew installs Qt6 in a versioned prefix; cmake's find_package
          # needs the hint. The prefix differs by arch (/opt/homebrew on arm64,
          # /usr/local on Intel).
          CMAKE_PREFIX_PATH: ${{ matrix.brew_prefix }}/opt/qt@6:${{ matrix.brew_prefix }}/opt/sqlite:${{ matrix.brew_prefix }}/opt/libevent:${{ matrix.brew_prefix }}/opt/zeromq:${{ matrix.brew_prefix }}/opt/boost
        run: cmake -S . -B build -G Ninja -DBUILD_GUI=ON -DWITH_QRENCODE=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Strip
        run: strip -x build/bin/pricoin-qt

      - name: Package
        run: |
          mkdir -p dist
          STAGE="pricoin-${{ needs.resolve-tag.outputs.tag }}-${{ matrix.arch }}-macos"
          mkdir -p "dist/$STAGE"
          cp build/bin/pricoin-qt "dist/$STAGE/"
          cp COPYING              "dist/$STAGE/"
          cp README.md            "dist/$STAGE/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pricoin-macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    name: Draft GitHub release
    needs: [resolve-tag, build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and list
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip 2>/dev/null | sort > ../checksums.txt
          cd ..
          cat checksums.txt
          {
            echo "## SHA-256 checksums"
            echo ""
            echo '```'
            cat checksums.txt
            echo '```'
            echo ""
            echo "## Verify"
            echo ""
            echo '```bash'
            echo "# Linux / macOS"
            echo "sha256sum  pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-linux.tar.gz"
            echo "shasum -a 256  pricoin-${{ needs.resolve-tag.outputs.tag }}-arm64-macos.tar.gz"
            echo "shasum -a 256  pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-macos.tar.gz"
            echo "# Windows (PowerShell)"
            echo "Get-FileHash .\\pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-windows.zip -Algorithm SHA256"
            echo '```'
            echo ""
            echo "## Contents"
            echo ""
            echo "- **Linux (x86_64)** — pricoind, pricoin-cli, pricoin-qt"
            echo "- **Windows (x86_64)** — pricoin-qt.exe"
            echo "- **macOS (arm64, Apple Silicon)** — pricoin-qt"
            echo "- **macOS (x86_64, Intel)** — pricoin-qt"
            echo ""
            echo "Toy/educational fork of Bitcoin Core. Privacy-mandatory: only v4 confidential transactions are valid. See README.md for build prerequisites and CLI usage."
          } > release_body.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          body_path: release_body.md
          files: |
            release/*.tar.gz
            release/*.zip
            checksums.txt
