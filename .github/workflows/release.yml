name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to label the release with (e.g. v0.1.0). Used for filenames; the release itself will be a draft."
        required: true
        default: "v0.1.0-test"

permissions:
  contents: write

jobs:
  resolve-tag:
    name: Resolve tag for filenames
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    name: Linux x86_64 (daemon, cli, qt) — depends static
    needs: resolve-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          # Just the host compiler + things needed to drive the depends build
          # (and a few autotools bits required by some Qt sub-packages). All
          # actual link-time deps (Qt, Boost, libevent, sqlite, zmq, the X/xcb
          # stack) are built static via depends/, not pulled from apt.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make pkgconf python3 \
            curl wget bison patch xz-utils ca-certificates \
            autoconf automake libtool gettext

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-pc-linux-gnu
          key: depends-linux-${{ hashFiles('depends/packages/*.mk', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/linux.mk') }}

      - name: Build dependencies
        run: cd depends && make -j "$(nproc)" HOST=x86_64-pc-linux-gnu NO_QR=1

      - name: Configure
        run: |
          cmake -S . -B build \
            --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake \
            -DBUILD_GUI=ON -DWITH_QRENCODE=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Strip binaries
        run: strip build/bin/pricoind build/bin/pricoin-cli build/bin/pricoin-qt

      - name: Run Pricoin functional tests
        run: |
          ln -sf "$PWD/build/test/config.ini" "$PWD/test/config.ini"
          ln -sf "$PWD/test/functional/feature_pricoin_ct.py" "$PWD/build/test/functional/feature_pricoin_ct.py"
          BITCOIND=$PWD/build/bin/pricoind \
          BITCOINCLI=$PWD/build/bin/pricoin-cli \
          python3 test/functional/test_runner.py --pricoin --filter 'feature_pricoin_ct'

      - name: Show link footprint
        run: |
          echo "== ldd pricoin-qt =="; ldd build/bin/pricoin-qt || true
          echo "== glibc version requirement =="
          objdump -T build/bin/pricoin-qt 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -5

      - name: Package
        run: |
          mkdir -p dist
          STAGE="pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-linux"
          mkdir -p "dist/$STAGE"
          cp build/bin/pricoind        "dist/$STAGE/"
          cp build/bin/pricoin-cli     "dist/$STAGE/"
          cp build/bin/pricoin-qt      "dist/$STAGE/"
          cp COPYING                   "dist/$STAGE/"
          cp README.md                 "dist/$STAGE/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pricoin-linux-x86_64
          path: dist/*.tar.gz

  build-windows:
    name: Windows x86_64 (qt) — cross from Linux
    needs: resolve-tag
    # ubuntu-24.04 ships gcc-mingw-w64 13.x. ubuntu-22.04 has 10.x which
    # ICEs in `i386_pe_seh_unwind_emit` when building Qt's bundled PCRE2
    # under the hardening flags Qt enables (-fstack-clash-protection,
    # -fstack-protector-strong, -Wa,-mbig-obj). Newer mingw GCC fixes it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make pkgconf python3 \
            curl wget bison patch xz-utils \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-w64-mingw32
          key: depends-mingw32-${{ hashFiles('depends/packages/*.mk', 'depends/Makefile', 'depends/funcs.mk') }}

      - name: Build dependencies
        run: cd depends && make -j "$(nproc)" HOST=x86_64-w64-mingw32 NO_QT=

      - name: Configure
        run: |
          cmake -S . -B build \
            --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=ON -DWITH_QRENCODE=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Strip
        run: x86_64-w64-mingw32-strip build/bin/pricoin-qt.exe

      - name: Package
        run: |
          mkdir -p dist
          STAGE="pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-windows"
          mkdir -p "dist/$STAGE"
          cp build/bin/pricoin-qt.exe "dist/$STAGE/"
          cp COPYING                  "dist/$STAGE/"
          cp README.md                "dist/$STAGE/"
          (cd dist && zip -r "${STAGE}.zip" "$STAGE")
          rm -rf "dist/$STAGE"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pricoin-windows-x86_64
          path: dist/*.zip

  build-macos:
    # arm64 only. GitHub Actions retired the macos-13 (Intel) runners in
    # late 2025; jobs scheduled there sit in the queue indefinitely. Apple
    # Silicon binaries run on x86_64 Macs via Rosetta 2, so this still
    # covers all current macOS users with a single artifact.
    name: macOS arm64 (qt) — .dmg
    needs: resolve-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew update
          brew install cmake ninja boost libevent qt@6 sqlite zeromq pkgconf

      - name: Configure
        env:
          # Homebrew installs Qt6 in a versioned prefix; cmake's find_package
          # needs the hint. /opt/homebrew is the arm64 prefix.
          CMAKE_PREFIX_PATH: /opt/homebrew/opt/qt@6:/opt/homebrew/opt/sqlite:/opt/homebrew/opt/libevent:/opt/homebrew/opt/zeromq:/opt/homebrew/opt/boost
        # Disable IPC (multiprocess) — needs Cap'n Proto, and we don't ship
        # separated bitcoin-node/bitcoin-wallet binaries for macOS. Linux
        # builds get capnp through depends/.
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_GUI=ON -DWITH_QRENCODE=OFF -DENABLE_IPC=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Bundle Qt frameworks into Pricoin-Qt.app
        # The `deploy` target is wired in cmake/module/Maintenance.cmake.
        # On macOS hosts it runs contrib/macdeploy/macdeployqtplus, which
        # copies QtCore/QtGui/QtWidgets/etc into the .app bundle so the
        # binary is portable to a stock macOS install with no Qt present.
        # We discard the bundled .zip and DMG the .app ourselves below.
        run: cmake --build build --target deploy

      - name: Build Pricoin .icns from PNG logo
        # Bitcoin Core's bitcoin.icns is left over and has the wrong
        # branding; macdeployqtplus already copied that file in. Regenerate
        # in-place from the master Pricoin logo before DMG'ing.
        # macdeployqtplus writes the deployed bundle (with bundled Qt
        # frameworks and rewritten install_names) to build/dist/, leaving
        # build/Pricoin-Qt.app un-deployed — patch the icns in the deployed
        # copy.
        run: |
          ICONSET=icon.iconset
          rm -rf "$ICONSET"; mkdir "$ICONSET"
          SRC="src/qt/res/icons/bitcoin.png"   # the 1024x1024 master we replaced
          for size in 16 32 64 128 256 512 1024; do
            sips -z "$size" "$size" "$SRC" --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
          done
          # macOS expects the @2x variants too (each is just the next size up).
          cp "$ICONSET/icon_32x32.png"     "$ICONSET/icon_16x16@2x.png"
          cp "$ICONSET/icon_64x64.png"     "$ICONSET/icon_32x32@2x.png"
          cp "$ICONSET/icon_256x256.png"   "$ICONSET/icon_128x128@2x.png"
          cp "$ICONSET/icon_512x512.png"   "$ICONSET/icon_256x256@2x.png"
          cp "$ICONSET/icon_1024x1024.png" "$ICONSET/icon_512x512@2x.png"
          rm -f "$ICONSET/icon_64x64.png" "$ICONSET/icon_1024x1024.png"
          iconutil -c icns "$ICONSET" -o build/dist/Pricoin-Qt.app/Contents/Resources/bitcoin.icns

      - name: Verify Qt frameworks are bundled
        # Catches future regressions where the deploy step silently produces
        # a bundle pointing at the host's Homebrew Qt — the symptom users
        # see is a dyld "Library not loaded: /opt/homebrew/..." crash.
        run: |
          APP=build/dist/Pricoin-Qt.app
          test -d "$APP/Contents/Frameworks/QtWidgets.framework" \
            || { echo "ERROR: QtWidgets.framework missing from bundle"; exit 1; }
          if otool -L "$APP/Contents/MacOS/Pricoin-Qt" | grep -E '/opt/homebrew|/usr/local/Cellar'; then
            echo "ERROR: binary still references host Qt paths"; exit 1
          fi

      - name: Build .dmg
        run: |
          mkdir -p dist
          DMG="dist/pricoin-${{ needs.resolve-tag.outputs.tag }}-arm64-macos.dmg"
          # Stage the .app + a Drag-to-Applications symlink so the user can
          # install with one drag. UDZO = compressed read-only DMG.
          # macdeployqtplus writes the bundled .app to build/dist/.
          STAGE=$(mktemp -d)
          cp -R build/dist/Pricoin-Qt.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Pricoin-Qt ${{ needs.resolve-tag.outputs.tag }}" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "$DMG"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pricoin-macos-arm64
          path: dist/*.dmg

  release:
    name: Draft GitHub release
    needs: [resolve-tag, build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and list
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip *.dmg 2>/dev/null | sort > ../checksums.txt
          cd ..
          cat checksums.txt
          {
            echo "## SHA-256 checksums"
            echo ""
            echo '```'
            cat checksums.txt
            echo '```'
            echo ""
            echo "## Verify"
            echo ""
            echo '```bash'
            echo "# Linux"
            echo "sha256sum     pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-linux.tar.gz"
            echo "# macOS"
            echo "shasum -a 256 pricoin-${{ needs.resolve-tag.outputs.tag }}-arm64-macos.dmg"
            echo "# Windows (PowerShell)"
            echo "Get-FileHash .\\pricoin-${{ needs.resolve-tag.outputs.tag }}-x86_64-windows.zip -Algorithm SHA256"
            echo '```'
            echo ""
            echo "## Contents"
            echo ""
            echo "- **Linux (x86_64)** — pricoind, pricoin-cli, pricoin-qt"
            echo "- **Windows (x86_64)** — pricoin-qt.exe"
            echo "- **macOS (arm64)** — Pricoin-Qt.app inside a .dmg; runs on x86_64 Macs via Rosetta 2"
            echo ""
            echo "Toy/educational fork of Bitcoin Core. Privacy-mandatory: only v4 confidential transactions are valid. See README.md for build prerequisites and CLI usage."
          } > release_body.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          body_path: release_body.md
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.dmg
            checksums.txt
